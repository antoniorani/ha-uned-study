name: "UNED Study"
version: "0.2.1"
slug: "uned_study"
description: "Estudio adaptativo y simulacros dentro de Home Assistant"
url: "https://github.com/antoniorani/ha-uned-study"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:school"
panel_title: "UNED Study"
panel_admin: false
backup: cold
stage: stable
watchdog: "http://[HOST]:[PORT:8099]/health"
options:
  content_repository: "https://github.com/antoniorani/uned-study-content"
  content_branch: "main"
  sync_interval_hours: 6
schema:
  content_repository: url
  content_branch: str
  sync_interval_hours: "int(1,168)"
