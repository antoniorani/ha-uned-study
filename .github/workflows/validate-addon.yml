name: Validate Home Assistant app

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: addon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check aiohttp pyyaml

      - name: Validate repository and app configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          repository = yaml.safe_load(Path("repository.yaml").read_text())
          config = yaml.safe_load(Path("uned-study/config.yaml").read_text())

          assert repository["name"] == "UNED Study"
          assert config["slug"] == "uned_study"
          assert config["ingress"] is True
          assert config["ingress_port"] == 8099
          assert config["panel_admin"] is False
          assert config["backup"] == "cold"
          assert set(config["arch"]) == {"amd64", "aarch64"}
          assert config["stage"] == "experimental"
          PY

      - name: Compile Python
        run: python -m compileall -q uned-study/app

      - name: Check frontend JavaScript
        run: node --check uned-study/app/uned_study/static/app.js

      - name: Run regression tests
        env:
          PYTHONPATH: uned-study/app
        run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app image
        run: |
          docker build             --build-arg BUILD_VERSION=ci             --build-arg BUILD_ARCH=amd64             -t uned-study-ci             uned-study

      - name: Verify image labels
        run: |
          test "$(docker inspect -f '{{ index .Config.Labels "io.hass.type" }}' uned-study-ci)" = "app"
          test "$(docker inspect -f '{{ index .Config.Labels "io.hass.arch" }}' uned-study-ci)" = "amd64"
