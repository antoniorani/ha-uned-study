name: Validate integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"

      - name: Compile Python sources
        run: python -m compileall -q custom_components

      - name: Check frontend JavaScript syntax
        run: node --check custom_components/uned_study/frontend/uned-study.js

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/uned_study/manifest.json > /dev/null
          python -m json.tool custom_components/uned_study/strings.json > /dev/null
          python -m json.tool custom_components/uned_study/translations/en.json > /dev/null
          python -m json.tool custom_components/uned_study/translations/es.json > /dev/null
          python -m json.tool hacs.json > /dev/null

      - name: Build alpha install package
        run: |
          python tools/package_release.py --version ci --output-dir dist
          python - <<'PY'
          from zipfile import ZipFile

          with ZipFile("dist/uned-study-ci.zip") as archive:
              names = set(archive.namelist())
              assert "custom_components/uned_study/manifest.json" in names
              assert "custom_components/uned_study/frontend/uned-study.js" in names
          PY

      - name: Upload alpha install package
        uses: actions/upload-artifact@v4
        with:
          name: uned-study-alpha
          path: dist/uned-study-ci.zip
          if-no-files-found: error
          retention-days: 14

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"

      - name: Install current Home Assistant
        run: python -m pip install --disable-pip-version-check "homeassistant==2026.9.3"

      - name: Import integration against Home Assistant
        run: |
          python - <<'PY'
          from custom_components.uned_study.assets import UNEDStudyAssetView
          from custom_components.uned_study.config_flow import UNEDStudyConfigFlow
          from custom_components.uned_study.content.sync import parse_github_repository
          from custom_components.uned_study.websocket import STUDY_MODES

          assert UNEDStudyAssetView.requires_auth is True
          assert UNEDStudyConfigFlow.VERSION == 1
          assert parse_github_repository(
              "https://github.com/antoniorani/uned-study-content"
          ).slug == "antoniorani/uned-study-content"
          assert "adaptive" in STUDY_MODES
          PY

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate custom integration with hassfest
        uses: home-assistant/actions/hassfest@master
