name: Validate integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python sources
        run: python -m compileall -q custom_components

      - name: Check frontend JavaScript syntax
        run: node --check custom_components/uned_study/frontend/uned-study.js

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/uned_study/manifest.json > /dev/null
          python -m json.tool custom_components/uned_study/strings.json > /dev/null
          python -m json.tool custom_components/uned_study/translations/en.json > /dev/null
          python -m json.tool custom_components/uned_study/translations/es.json > /dev/null
          python -m json.tool hacs.json > /dev/null
